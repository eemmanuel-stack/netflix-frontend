name: Build and push docker image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Check out the repository
      uses: actions/checkout@v2


    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: emmanuelcloud2026
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    

    - name: Docker build 
      run: |
        docker build -t netflix_frontend:latest .

    - name: Docker push
      run: |
        docker tag netflix_frontend:latest 060276830770.dkr.ecr.us-east-2.amazonaws.com/movie-frontend:${GITHUB_RUN_NUMBER}
        docker push 060276830770.dkr.ecr.us-east-2.amazonaws.com/movie-frontend:${GITHUB_RUN_NUMBER}
